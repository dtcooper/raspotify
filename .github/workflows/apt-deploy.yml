name: Deploy Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of release with .deb file asset attached it, for example 0.31.5'
        required: false

jobs:
  apt_deploy:
    runs-on: ubuntu-latest
    name: Deploy Release
    env:
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_SECRET_KEY_BASE64: ${{ secrets.GPG_SECRET_KEY_BASE64 }}
      RELEASE_TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: apt-repo

      - name: Download .deb files
        run: gh release download ${{ github.event.inputs.tag }}

      - name: Install reprepro
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro

      - name: Create and deploy repo
        run: ./deploy-apt-repo.sh
